spring.application.name=Dbever
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show-sql=true
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
# Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# API Info
springdoc.info.title=My API Documentation
springdoc.info.version=1.0
springdoc.info.description=API documentation for Spring Boot application

#Spring security Configurations
spring.security.user.name=venky
spring.security.user.password=Venky@2025